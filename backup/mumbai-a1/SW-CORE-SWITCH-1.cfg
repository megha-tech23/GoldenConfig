banner motd ^C
CC
                  /!\\ SECURE TEMPLATE 2026 /!\\
****************************************************************
* Access is restricted to authorized users                     *
* who must comply with the Electronic Communications Policy.   *
* Usage of this router is monitored;                           *
* Unauthorized access and/or use will be prosecuted.           *
****************************************************************
$(hostname)
****************************************************************
* Acces restreint aux personnes autorisees                     *
* soumis a la Politique de Communications Electronique.        *
* L'usage de ce routeur est monitore;                          *
* L'acces non autorise et/ou l'utilisation sera poursuivi.     *
****************************************************************
^C
!
line con 0
 logging synchronous
 login authentication console
 stopbits 1
line vty 0 4
 access-class 11 in
 login authentication ssh
 transport input all
line vty 5 31
 access-class 11 in
 authorization commands 0 commande
 authorization commands 1 commande
 authorization commands 15 commande
 authorization exec commande
 accounting commands 0 accounting
 accounting commands 1 accounting
 accounting commands 15 accounting
 logging synchronous
 login authentication ssh
 transport input ssh
!
ntp source GigabitEthernet1/0/1
ntp server 10.22.15.65 prefer
ntp server 10.22.15.81
ntp server 10.22.15.90
!

!
! Golden Config Intended Configuration
! Device: SW-CORE-SWITCH-1
!
 
hostname SW-CORE-SWITCH-1
 
!
! Global configuration
!
ip routing
ip name-server 10.96.1.11
ip domain lookup source-interface GigabitEthernet1/0/1
ip domain name lan.pld
 
ip dhcp snooping vlan 2-3,12,120,130,150
no ip dhcp snooping information option
ip dhcp snooping database bootflash:dhcp_snooping.txt
ip dhcp snooping database timeout 10
ip dhcp snooping
 
ip arp inspection vlan 2-3,12,120,130,150
ip arp inspection validate src-mac ip
ip arp inspection log-buffer entries 100
ip arp inspection log-buffer logs 20 interval 120
 
login block-for 300 attempts 3 within 60
login on-success log
 
udld aggressive
 
vtp mode off
vtp version 1
 
!
! Spanning Tree
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
spanning-tree vlan 1-4094 priority 61440
 
!
! Errdisable Recovery
!
errdisable recovery cause udld
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
 
!
! VLAN Configuration
!
vlan 2
name V-ADMIN-U
!
vlan 3
name V-ADMIN-WIFI-U
!
vlan 10
name USERS
!
vlan 11
name V-CU
!
vlan 12
name V-GCC
!
vlan 20
name GUEST
!
vlan 30
name Phone
!
vlan 100
name int200
!
vlan 120
name V-ZSC-U
!
vlan 121
name V-VNC-U
!
vlan 122
name V-PART-U
!
vlan 130
name V-GUEST-U
!
vlan 131
name V-PRINT-U
!
vlan 132
name V-TMD-TIM
!
vlan 133
name V-OOD-U
!
vlan 140
name V-VISIO-U
!
vlan 150
name V-TOIP-U
!
vlan 160
name V-REM-U
!
vlan 200
name GGN200
 
!
! Port Channel
!
interface Port-channel1
description UPLINK_TO_DISTRIBUTION_SW
switchport trunk native vlan 160
switchport trunk allowed vlan 2,12,120,140,150,160
switchport mode trunk
switchport nonegotiate
ip arp inspection trust
spanning-tree guard root
ip dhcp snooping trust
 
!
! Out-of-Band Management Interface
!
interface GigabitEthernet0/0
description Out-of-Band Management
vrf forwarding Mgmt-vrf
ip address dhcp
shutdown
negotiation auto
 
!
! Management Interface
!
interface GigabitEthernet1/0/1
description Out-of-Band Management
no switchport
ip address 172.17.152.182 255.255.255.0
 
!
! WLC Connection
!
interface GigabitEthernet1/0/2
description Connection_to_C9800_wlc
switchport trunk allowed vlan 10,20
switchport mode trunk
 
!
! Access Port
!
interface GigabitEthernet1/0/3
switchport access vlan 10
switchport mode access
 
!
! Access Port
!
interface GigabitEthernet1/0/4
switchport access vlan 20
switchport mode access
 
!
! Trunk Port
!
interface GigabitEthernet1/0/7
switchport mode trunk
 
!
! VISIO Port
!
interface GigabitEthernet1/0/10
description VISIO_PORT
switchport access vlan 140
switchport mode access
switchport nonegotiate
switchport port-security violation restrict
switchport port-security mac-address sticky
switchport port-security
ip arp inspection limit rate 100
no snmp trap link-status
storm-control broadcast level 5.00
storm-control multicast level 5.00
storm-control unicast level 5.00
storm-control action trap
spanning-tree guard root
ip dhcp snooping limit rate 100
 
!
! Access Port
!
interface GigabitEthernet1/0/11
switchport access vlan 140
switchport mode access
 
!
! Access Point
!
interface GigabitEthernet1/0/20
description ACCESS_POINT
switchport trunk native vlan 12
switchport trunk allowed vlan 12,120,150
switchport mode trunk
switchport nonegotiate
ip arp inspection trust
storm-control broadcast level 5.00
storm-control multicast level 5.00
spanning-tree portfast trunk
spanning-tree guard root
ip dhcp snooping trust
 
!
! Uplink
!
interface GigabitEthernet1/0/23
description UPLINK_TO_DISTRIBUTION_SW
switchport trunk native vlan 160
switchport trunk allowed vlan 2,12,120,140,150,160
switchport mode trunk
switchport nonegotiate
ip arp inspection trust
channel-group 1 mode active
ip dhcp snooping trust
 
!
! Uplink
!
interface GigabitEthernet1/0/24
description UPLINK_TO_DISTRIBUTION_SW
switchport trunk native vlan 160
switchport trunk allowed vlan 2,12,120,140,150,160
switchport mode trunk
switchport nonegotiate
ip arp inspection trust
channel-group 1 mode active
ip dhcp snooping trust
 
!
! VLAN Interfaces
!
interface Vlan1
no ip address
shutdown
 
!
interface Vlan2
description VLAN_de_Supervision
ip address 10.23.70.15 255.255.255.0
 
!
interface Vlan10
ip address 192.168.10.1 255.255.255.0
 
!
interface Vlan20
ip address 192.168.20.10 255.255.255.0
ip helper-address 192.168.10.10
 
!
interface Vlan100
vrf forwarding int200
ip address 10.10.10.10 255.255.255.0
 
!
interface Vlan200
vrf forwarding grn200
ip address 20.20.20.20 255.255.255.0
ip ospf 200 area 0
 
!
! OSPF
!
router ospf 200 vrf grn200
router-id 2.2.2.2
network 20.20.20.0 0.0.0.255 area 0
 
!
! BGP
!
router bgp 65003
bgp log-neighbor-changes
 
address-family ipv4 vrf grn200
  neighbor 20.20.20.2 remote-as 65001
  neighbor 20.20.20.2 activate
exit-address-family
 
address-family ipv4 vrf int200
  neighbor 10.10.10.2 remote-as 65001
  neighbor 10.10.10.2 activate
exit-address-family
 
!
! Default Routing
!
ip default-gateway 172.17.152.254
ip route 0.0.0.0 0.0.0.0 172.17.152.254
 
!
! HTTP / HTTPS
!
no ip http server
ip http authentication local
ip http secure-server
ip http secure-trustpoint SLA-TrustPoint
ip http client source-interface GigabitEthernet1/0/1
 
!
! SSH
!
ip ssh bulk-mode 131072
ip ssh time-out 60
ip ssh source-interface GigabitEthernet1/0/1
 
!
! TACACS Source
!
ip tacacs source-interface GigabitEthernet1/0/1
 
!
! Logging
!
logging origin-id hostname
logging facility daemon
logging source-interface GigabitEthernet1/0/1
logging host 10.23.7.20
 
!
! SNMP
!
snmp-server group G-READ v3 priv read V3-READ-VIEW access 55
snmp-server view V3-READ-VIEW iso included
snmp-server trap-source GigabitEthernet1/0/1
snmp-server location DEFAULT_LOCATION
 
!
! NTP
!
ntp source GigabitEthernet1/0/1
ntp server 10.22.15.65 prefer
ntp server 10.22.15.81
 
!
! NETCONF / YANG
!
netconf-yang
netconf-yang feature candidate-datastore
yang-interfaces aaa authentication method-list ssh
yang-interfaces aaa authorization method-list commande
 
!
end